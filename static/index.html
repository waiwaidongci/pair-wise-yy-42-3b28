<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山火事件指挥 · 观察/签认/交接版本链</title>
<style>
  :root{--ink:#17212b;--mut:#5b6b7a;--line:#dfe6ec;--bg:#f4f7f9;--ok:#1a7f4b;--warn:#b25e00;--err:#b3261e;--accent:#1f6feb;}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;color:var(--ink);background:#fff}
  header{padding:1rem 1.5rem;border-bottom:1px solid var(--line);background:var(--bg)}
  header h1{margin:0 0 .25rem;font-size:1.25rem}
  header p{margin:0;color:var(--mut);font-size:.9rem}
  main{display:grid;grid-template-columns:300px 1fr;gap:1rem;padding:1rem 1.5rem;max-width:1200px;margin:0 auto}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  section{border:1px solid var(--line);border-radius:8px;padding:.85rem 1rem;background:#fff}
  section h2{margin:0 0 .6rem;font-size:1rem;display:flex;align-items:center;gap:.5rem}
  .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.5rem}
  input,select,textarea{font:inherit;padding:.4rem .5rem;border:1px solid var(--line);border-radius:6px;width:100%}
  textarea{min-height:60px;resize:vertical}
  button{font:inherit;padding:.42rem .8rem;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.danger{background:var(--err);color:#fff;border-color:var(--err)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .muted{color:var(--mut);font-size:.85rem}
  .pill{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.78rem;border:1px solid var(--line)}
  .pill.ok{color:var(--ok);border-color:var(--ok)}
  .pill.warn{color:var(--warn);border-color:var(--warn)}
  .pill.err{color:var(--err);border-color:var(--err)}
  .pill.mut{color:var(--mut)}
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{padding:.45rem .5rem;border-bottom:1px solid var(--line);font-size:.85rem}
  ul.list li:last-child{border-bottom:none}
  .item-row{cursor:pointer;border-radius:6px}
  .item-row:hover{background:var(--bg)}
  .item-row.active{background:#eaf1ff;border-color:var(--accent)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .signoff-box{border:1px dashed var(--line);border-radius:6px;padding:.6rem .7rem;margin-bottom:.6rem}
  .signoff-box.valid{border-color:var(--ok);background:#f0fbf4}
  .signoff-box.invalid{border-color:var(--warn);background:#fff7ef}
  .reason{color:var(--warn);font-size:.85rem;margin-top:.3rem}
  .reason.err{color:var(--err)}
  #toast{position:fixed;top:1rem;right:1rem;max-width:360px;padding:.7rem .9rem;border-radius:8px;color:#fff;font-size:.85rem;z-index:50;display:none;box-shadow:0 4px 16px rgba(0,0,0,.18)}
  #toast.ok{background:var(--ok)} #toast.err{background:var(--err)}
  .audit-order{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
  .audit-order li{display:flex;gap:.5rem;align-items:baseline}
  .audit-order .idx{color:var(--mut);min-width:2.2rem}
  .chain-ok{color:var(--ok);font-weight:600}
  .chain-bad{color:var(--err);font-weight:600}
  .empty{color:var(--mut);font-size:.85rem;padding:.4rem 0}
  .detail-toggle{cursor:pointer;color:var(--accent);font-size:.78rem;background:none;border:none;padding:0}
  pre.detail{background:var(--bg);padding:.5rem;border-radius:6px;font-size:.75rem;overflow:auto;margin:.3rem 0 0;display:none}
</style>
</head>
<body>
<header>
  <h1>山火事件指挥 · 观察 / 签认 / 交接 版本链</h1>
  <p>任务区观察或交接窗口一变，未完成的关闭签认立即失效并需重新确认；窗口外提交按越权拒绝；交接双方与每次处理写入同一条审计链。</p>
</header>

<main>
  <!-- 左：身份 + 事件列表 -->
  <section>
    <h2>身份与事件</h2>
    <div class="grid2">
      <label class="muted">X-Actor<input id="actor" value="zhang"></label>
      <label class="muted">X-Role
        <select id="role">
          <option value="incident_commander">incident_commander</option>
          <option value="field_commander">field_commander</option>
          <option value="logistics">logistics</option>
          <option value="viewer">viewer</option>
        </select>
      </label>
    </div>
    <div class="row" style="margin-top:.5rem">
      <button class="primary" onclick="loadItems()">刷新事件列表</button>
    </div>
    <ul class="list" id="items"><li class="empty">未加载</li></ul>
    <h2 style="margin-top:1rem">新建事件</h2>
    <label class="muted">标题<input id="new-title" value="夜班火场"></label>
    <label class="muted">描述<textarea id="new-desc">火线与风向</textarea></label>
    <div class="grid2">
      <label class="muted">严重度
        <select id="new-sev"><option>low</option><option>moderate</option><option selected>high</option><option>extreme</option></select>
      </label>
      <label class="muted">数量<input id="new-qty" type="number" value="5"></label>
    </div>
    <div class="row" style="margin-top:.5rem">
      <button onclick="createItem()">创建事件</button>
    </div>
  </section>

  <!-- 右：选中事件的版本链 -->
  <section id="detail">
    <h2 id="detail-title">请选择事件</h2>
    <div id="detail-body" style="display:none">

      <div class="row">
        <span class="pill mut" id="d-status"></span>
        <span class="pill mut" id="d-version"></span>
        <span class="pill mut" id="d-obsver"></span>
        <span class="pill mut" id="d-win"></span>
      </div>

      <!-- 任务区观察 -->
      <h2>任务区观察 <span class="muted" style="font-weight:400">推进观察版本，关闭签认随之失效</span></h2>
      <ul class="list" id="observations"><li class="empty">暂无观察</li></ul>
      <div class="grid2" style="margin-top:.5rem">
        <label class="muted">种类
          <select id="obs-kind">
            <option value="wind_direction">wind_direction 风向</option>
            <option value="wind_speed">wind_speed 风速</option>
            <option value="fire_front">fire_front 火线</option>
            <option value="situation">situation 态势</option>
            <option value="weather">weather 天气</option>
          </select>
        </label>
        <label class="muted">记录<textarea id="obs-detail" placeholder="例如：转南风4级">转南风4级</textarea></label>
      </div>
      <div class="row" style="margin-top:.5rem">
        <button onclick="addObservation()">记录观察（推进版本）</button>
      </div>

      <!-- 角色交接 -->
      <h2 style="margin-top:1rem">角色交接 <span class="muted" style="font-weight:400">交接双方形成授权窗口，旧签认失效</span></h2>
      <ul class="list" id="handovers"><li class="empty">暂无交接</li></ul>
      <div class="grid2" style="margin-top:.5rem">
        <label class="muted">接方 X-Actor<input id="ho-to-actor" value="li"></label>
        <label class="muted">接方 X-Role
          <select id="ho-to-role">
            <option value="incident_commander">incident_commander</option>
            <option value="field_commander">field_commander</option>
            <option value="logistics">logistics</option>
            <option value="viewer">viewer</option>
          </select>
        </label>
      </div>
      <label class="muted">交接原因<input id="ho-reason" value="夜班交接，关闭权限移交副指挥"></label>
      <div class="row" style="margin-top:.5rem">
        <button onclick="addHandover()">交接权限（双方入链）</button>
      </div>

      <!-- 关闭签认 -->
      <h2 style="margin-top:1rem">关闭签认 <span class="muted" style="font-weight:400">绑定观察版本与交接窗口</span></h2>
      <div class="signoff-box invalid" id="signoff-box">
        <div class="row" style="margin:0">
          <span class="pill err" id="so-pill">无有效签认</span>
          <span class="muted" id="so-meta"></span>
        </div>
        <div class="reason" id="so-reason"></div>
      </div>
      <div class="row">
        <button class="primary" onclick="createSignoff()">由当前授权人签认</button>
        <button class="danger" onclick="closeItem()">关闭火场（消耗签认）</button>
        <span class="muted" id="close-hint"></span>
      </div>

      <!-- 审计链 -->
      <h2 style="margin-top:1rem">审计链 <span class="muted" style="font-weight:400">交接双方与每次处理按序入链</span>
        <span id="chain-status" class="pill mut">校验中…</span>
      </h2>
      <ol class="audit-order" id="audit"><li class="empty">暂无审计</li></ol>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
let currentItem = null;
const $ = id => document.getElementById(id);
function headers(extra){
  return Object.assign({'Content-Type':'application/json','X-Actor':$('actor').value,'X-Role':$('role').value}, extra||{});
}
function toast(msg, ok){
  const t=$('toast'); t.textContent=msg; t.className=ok?'ok':'err'; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',4200);
}
async function api(path, opts){
  const r = await fetch(path, opts);
  let body=null; try{body=await r.json();}catch(e){}
  if(!r.ok){
    const msg=(body&&body.message)?body.message:('HTTP '+r.status);
    const err=new Error(msg); err.status=r.status; err.body=body; throw err;
  }
  return body;
}
function pillClass(status){
  if(status==='closed')return 'ok';
  if(status==='controlled'||status==='contained')return 'warn';
  return 'mut';
}

async function loadItems(){
  try{
    const data = await api('/api/items',{headers:headers()});
    const ul=$('items'); ul.innerHTML='';
    if(!data.items.length){ul.innerHTML='<li class="empty">暂无事件</li>'; return;}
    data.items.forEach(it=>{
      const li=document.createElement('li');
      li.className='item-row';
      if(currentItem && it.id===currentItem.id) li.classList.add('active');
      li.innerHTML = '<div><strong>#'+it.id+'</strong> '+it.title+'</div>'+
        '<div class="muted">'+it.status+' · v'+it.version+' · 优先级'+it.priority+'</div>';
      li.onclick=()=>selectItem(it.id);
      ul.appendChild(li);
    });
  }catch(e){toast('加载失败：'+e.message,false);}
}

async function selectItem(id){
  try{
    const it = await api('/api/items/'+id,{headers:headers()});
    currentItem = it;
    $('detail-body').style.display='block';
    $('detail-title').textContent = '事件 #'+it.id+' · '+it.title;
    $('d-status').textContent = it.status; $('d-status').className='pill '+pillClass(it.status);
    $('d-version').textContent = '项目版本 v'+it.version;
    await refreshVersionState();
    await loadObservations();
    await loadHandovers();
    await loadSignoff();
    await loadAudit();
    loadItems();
  }catch(e){toast('加载事件失败：'+e.message,false);}
}

async function refreshVersionState(){
  const so = await api('/api/items/'+currentItem.id+'/signoff',{headers:headers()});
  $('d-obsver').textContent = '观察 v'+so.observation_version;
  $('d-win').textContent = '交接窗口 w'+so.handover_window;
}

async function loadObservations(){
  const data = await api('/api/items/'+currentItem.id+'/observations',{headers:headers()});
  const ul=$('observations'); ul.innerHTML='';
  if(!data.observations.length){ul.innerHTML='<li class="empty">暂无观察</li>'; return;}
  data.observations.slice().reverse().forEach(o=>{
    const li=document.createElement('li');
    li.innerHTML='<strong>v'+o.version+'</strong> '+o.kind+'：'+o.detail+
      '<div class="muted">'+o.recorded_by+' @ '+o.recorded_at+'</div>';
    ul.appendChild(li);
  });
}

async function loadHandovers(){
  const data = await api('/api/items/'+currentItem.id+'/handovers',{headers:headers()});
  const ul=$('handovers'); ul.innerHTML='';
  if(!data.handovers.length){ul.innerHTML='<li class="empty">暂无交接</li>'; return;}
  data.handovers.slice().reverse().forEach(h=>{
    const li=document.createElement('li');
    li.innerHTML='<strong>w'+h.window_version+'</strong> '+h.from_actor+'（'+h.from_role+'）→ '+
      h.to_actor+'（'+h.to_role+'）'+(h.reason?' · '+h.reason:'')+
      '<div class="muted">'+h.created_at+'</div>';
    ul.appendChild(li);
  });
}

async function loadSignoff(){
  const so = await api('/api/items/'+currentItem.id+'/signoff',{headers:headers()});
  const box=$('signoff-box');
  box.className='signoff-box '+(so.valid?'valid':'invalid');
  if(so.valid){
    $('so-pill').textContent='当前有效签认'; $('so-pill').className='pill ok';
    const s=so.signoff;
    $('so-meta').textContent='签认 #'+s.id+' · 观察 v'+s.observation_version+' · 窗口 w'+s.handover_window+' · 签认人 '+s.signer_actor;
    $('so-reason').textContent='';
  }else{
    const s=so.signoff;
    if(s && s.status==='consumed'){
      $('so-pill').textContent='已消耗'; $('so-pill').className='pill mut';
      $('so-meta').textContent='签认 #'+s.id+' 已用于关闭';
    }else if(s && s.status==='expired'){
      $('so-pill').textContent='已失效'; $('so-pill').className='pill err';
      $('so-meta').textContent='签认 #'+s.id+' · 基于观察 v'+s.observation_version+' / 窗口 w'+s.handover_window;
    }else{
      $('so-pill').textContent='无有效签认'; $('so-pill').className='pill err';
      $('so-meta').textContent='';
    }
    $('so-reason').textContent=so.reason||'';
  }
}

async function loadAudit(){
  const data = await api('/api/items/'+currentItem.id+'/audit',{headers:headers()});
  const ol=$('audit'); ol.innerHTML='';
  const cs=$('chain-status');
  if(data.chain_valid){cs.textContent='链完整 ✓'; cs.className='pill ok chain-ok';}
  else{cs.textContent='链被篡改 ✗'; cs.className='pill err chain-bad';}
  if(!data.events.length){ol.innerHTML='<li class="empty">暂无审计</li>'; return;}
  data.events.forEach(e=>{
    const li=document.createElement('li');
    const head=document.createElement('div');
    head.innerHTML='<span class="idx">#'+e.id+'</span><span class="pill mut">'+e.action+'</span> '+
      '<span class="muted">'+e.actor+'</span> <span class="muted">'+e.created_at+'</span>';
    li.appendChild(head);
    const btn=document.createElement('button'); btn.className='detail-toggle'; btn.textContent='详情';
    const pre=document.createElement('pre'); pre.className='detail'; pre.textContent=JSON.stringify(e.detail,null,2);
    btn.onclick=()=>{pre.style.display=pre.style.display==='block'?'none':'block';};
    li.appendChild(btn); li.appendChild(pre);
    ol.appendChild(li);
  });
}

async function createItem(){
  try{
    const body={
      title:$('new-title').value, description:$('new-desc').value,
      severity:$('new-sev').value, quantity:parseFloat($('new-qty').value)||0, threshold:1
    };
    // 事件由 field_commander 建立；签认/交接/关闭由当前选择的身份执行
    const h=Object.assign({}, headers(), {'X-Actor':'creator','X-Role':'field_commander'});
    const it=await api('/api/items',{method:'POST',headers:h,body:JSON.stringify(body)});
    toast('已创建事件 #'+it.id,true);
    selectItem(it.id);
  }catch(e){toast('创建失败：'+e.message,false);}
}

async function addObservation(){
  try{
    const body={kind:$('obs-kind').value, detail:$('obs-detail').value};
    await api('/api/items/'+currentItem.id+'/observations',{method:'POST',headers:headers(),body:JSON.stringify(body)});
    toast('已记录观察，旧签认已失效',true);
    await refreshVersionState(); await loadObservations(); await loadSignoff(); await loadAudit();
  }catch(e){toast('记录观察失败：'+e.message,false);}
}

async function addHandover(){
  try{
    const body={to_actor:$('ho-to-actor').value, to_role:$('ho-to-role').value, reason:$('ho-reason').value};
    const h=await api('/api/items/'+currentItem.id+'/handovers',{method:'POST',headers:headers(),body:JSON.stringify(body)});
    toast('已交接：'+h.from_actor+' → '+h.to_actor+'，旧签认已失效',true);
    await refreshVersionState(); await loadHandovers(); await loadSignoff(); await loadAudit();
  }catch(e){toast('交接失败：'+e.message,false);}
}

async function createSignoff(){
  try{
    const s=await api('/api/items/'+currentItem.id+'/signoffs',{method:'POST',headers:headers()});
    toast('已签认 #'+s.id+'（观察 v'+s.observation_version+' / 窗口 w'+s.handover_window+'）',true);
    await refreshVersionState(); await loadSignoff(); await loadAudit();
  }catch(e){
    toast('签认被拒绝：'+e.message,false);
    await loadSignoff(); await loadAudit();
  }
}

async function closeItem(){
  try{
    const it=await api('/api/items/'+currentItem.id,{headers:headers()});
    const closed=await api('/api/items/'+currentItem.id+'/transition',{
      method:'POST',headers:headers(),
      body:JSON.stringify({target:'closed',expected_version:it.version})
    });
    toast('火场已关闭，签认已消耗',true);
    await selectItem(closed.id);
  }catch(e){
    toast('关闭被拒绝：'+e.message,false);
    await loadSignoff(); await loadAudit();
  }
}

loadItems();
</script>
</body>
</html>
