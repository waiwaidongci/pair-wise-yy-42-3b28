<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>观察—关闭签认—角色交接 版本联动</title>
<style>
:root{--bd:#d7dee5;--bg:#f4f7f9;--ok:#0a7d3c;--bad:#c62828;--warn:#b26a00;--blue:#0b4f8a}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1080px;margin:1.5rem auto;padding:0 1rem;color:#17212b}
h1{font-size:1.35rem} h2{font-size:1.05rem;margin:1.4rem 0 .5rem;border-left:4px solid var(--blue);padding-left:.5rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.4rem 0}
button{padding:.45rem .8rem;border:1px solid var(--bd);border-radius:6px;background:#fff;cursor:pointer;font-size:.85rem}
button:hover{background:#eef4fa}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.danger{border-color:#e2a0a0;color:var(--bad)}
select,input{padding:.4rem;border:1px solid var(--bd);border-radius:6px;font-size:.85rem}
.card{border:1px solid var(--bd);border-radius:8px;padding:.8rem;margin:.6rem 0;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{border:1px solid var(--bd);padding:.35rem .5rem;text-align:left;vertical-align:top}
th{background:var(--bg)}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:10px;font-size:.75rem;font-weight:600}
.b-active{background:#e3f4ea;color:var(--ok)} .b-pending{background:#fff4e0;color:var(--warn)}
.b-invalidated,.b-rejected{background:#fdeaea;color:var(--bad)} .b-consumed{background:#e8edf2;color:#445}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.warn{color:var(--warn)}
#toast{position:fixed;right:1rem;top:1rem;padding:.6rem 1rem;border-radius:8px;display:none;max-width:46%;font-size:.85rem;box-shadow:0 4px 14px #0002}
.toast-ok{background:#e3f4ea;color:var(--ok);border:1px solid #9ed8b5}
.toast-bad{background:#fdeaea;color:var(--bad);border:1px solid #f0b4b4}
.small{font-size:.78rem;color:#5a6b7a}
.hash{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<h1>任务区观察 · 关闭签认 · 角色交接 —— 版本联动控制台</h1>
<p class="small">观察或交接窗口一变，未完成签认立即失效并须重新确认；窗口外提交按越权拒绝并写入审计；交接双方与每次处理都进入同一条哈希审计链。</p>

<div class="card">
  <div class="row">
    <strong>当前身份</strong>
    <select id="actor">
      <option value="sun">sun（值班指挥 incident_commander）</option>
      <option value="qian">qian（副指挥 deputy_commander）</option>
      <option value="zhao">zhao（现场观察 field_commander）</option>
      <option value="li">li（物流 logistics）</option>
    </select>
    <select id="role">
      <option value="incident_commander">incident_commander</option>
      <option value="deputy_commander">deputy_commander</option>
      <option value="field_commander">field_commander</option>
      <option value="logistics">logistics</option>
      <option value="viewer">viewer</option>
    </select>
    <span class="small">（身份与角色可故意错配，演示越权拒绝）</span>
  </div>
  <div class="row">
    <button class="primary" onclick="bootstrap()">① 一键搭建受控火场+观察窗口</button>
    <button onclick="loadAll()">刷新</button>
    <span class="small">任务区ID：<input id="iid" style="width:5rem" value="1"></span>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2>② 任务区观察窗口（field_commander）</h2>
    <div class="row">
      任务区<input id="zone" value="东坡任务区" style="width:7rem">
      风向<select id="wind"><option>N</option><option>NE</option><option>E</option><option>SE</option><option selected>S</option><option>SW</option><option>W</option><option>NW</option></select>
      风速<input id="wspeed" value="3" style="width:4rem">
      <button class="primary" onclick="observe()">提交观察（改版本→签认失效）</button>
    </div>
    <div id="obs"></div>
  </div>

  <div class="card">
    <h2>③ 关闭权限交接（incident_commander）</h2>
    <div class="row">
      交给<input id="toActor" value="qian" style="width:6rem">
      <select id="toRole"><option value="deputy_commander">deputy_commander</option><option value="incident_commander">incident_commander</option></select>
      <input id="reason" value="夜班交接，关闭权限临时移交" style="width:13rem">
      <button class="primary" onclick="handover()">交接（旧签认立即失效）</button>
    </div>
    <div id="authority"></div>
  </div>
</div>

<div class="card">
  <h2>④ 关闭签认（当前持权人）</h2>
  <div class="row">
    依据<input id="basis" value="火势受控，当前风向下无复燃风险" style="width:18rem">
    <button class="primary" onclick="submitSignoff()">提交签认</button>
    <button onclick="confirmSignoff()">二次确认最新 pending</button>
    <button class="danger" onclick="closeFire()">凭有效签认关闭火场</button>
  </div>
  <div id="effective"></div>
  <div id="signoffs"></div>
</div>

<div class="card">
  <h2>⑤ 审计链（同一事件，按顺序，SHA-256 链式校验）</h2>
  <div class="row"><span id="chainState"></span></div>
  <div id="audit"></div>
</div>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
function hdr(){return {'X-Actor':$('actor').value,'X-Role':$('role').value,'Content-Type':'application/json'};}
function toast(msg,ok){const t=$('toast');t.textContent=msg;t.className=ok?'toast-ok':'toast-bad';t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',4200);}
async function api(method,url,body){
  const r=await fetch(url,{method,headers:hdr(),body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok){toast(`[${r.status}] ${data.error||''} ${data.message||''}`,false);throw data;}
  return data;
}
const badge=s=>`<span class="badge b-${s}">${s}</span>`;
async function bootstrap(){
  let it=await api('POST','/api/items',{title:'夜班火线A',description:'版本联动演示',severity:'high',quantity:3,threshold:8,external_ref:'DEMO-1'}).catch(()=>null);
  if(!it){toast('演示事件已存在，请直接刷新或更换external_ref',true);}
  const id=it?it.id:1; $('iid').value=id;
  // 用固定指挥身份推进状态并补一条已关闭记录
  const savedA=$('actor').value,savedR=$('role').value;
  $('actor').value='zhao';$('role').value='field_commander';
  await api('POST',`/api/items/${id}/records`,{kind:'patrol',detail:'巡线完毕',status:'closed',external_ref:'P-1'}).catch(()=>{});
  $('actor').value='sun';$('role').value='incident_commander';
  let cur=await api('GET',`/api/items/${id}`);
  for(const t of ['active','contained','controlled']){
    if(cur.status!==t) cur=await api('POST',`/api/items/${id}/transition`,{target:t,expected_version:cur.version});
  }
  $('actor').value='zhao';$('role').value='field_commander';
  await api('POST',`/api/items/${id}/observation`,{task_zone:$('zone').value,wind_dir:$('wind').value,wind_speed:Number($('wspeed').value)}).catch(()=>{});
  $('actor').value=savedA;$('role').value=savedR;
  toast('已搭建：controlled 火场 + 观察窗口',true);
  loadAll();
}
async function observe(){
  const id=$('iid').value;
  await api('POST',`/api/items/${id}/observation`,{task_zone:$('zone').value,wind_dir:$('wind').value,wind_speed:Number($('wspeed').value)});
  toast('观察窗口已更新，未完成签认失效',true);loadAll();
}
async function handover(){
  const id=$('iid').value;
  await api('POST',`/api/items/${id}/handover`,{to_actor:$('toActor').value,to_role:$('toRole').value,reason:$('reason').value});
  toast('交接完成，旧签认全部失效，须重新确认',true);loadAll();
}
async function submitSignoff(){
  const id=$('iid').value;
  await api('POST',`/api/items/${id}/signoffs`,{basis:$('basis').value});
  toast('签认已提交（pending）',true);loadAll();
}
async function confirmSignoff(){
  const id=$('iid').value;
  const v=await api('GET',`/api/items/${id}/signoffs`);
  const p=[...v.signoffs].reverse().find(s=>s.status==='pending');
  if(!p){toast('没有 pending 签认可确认',false);return;}
  await api('POST',`/api/items/${id}/signoffs/${p.id}/confirm`);
  toast('签认已确认，成为当前有效签认',true);loadAll();
}
async function closeFire(){
  const id=$('iid').value;
  const v=await api('GET',`/api/items/${id}/signoffs`);
  if(!v.current_effective_signoff){toast('无当前有效签认，不能关闭',false);return;}
  const r=await api('POST',`/api/items/${id}/signoffs/close`,{signoff_id:v.current_effective_signoff.id});
  toast(`火场已关闭：${r.item.status}`,true);loadAll();
}
function renderObs(v){
  const o=v.observation;
  $('obs').innerHTML=o?`<table><tr><th>版本</th><th>任务区</th><th>风向(关闭依据)</th><th>风速</th><th>更新人</th></tr>
    <tr><td class="mono">v${o.version}</td><td>${o.task_zone}</td><td class="mono">${o.wind_dir}</td><td>${o.wind_speed}</td><td>${o.updated_by}</td></tr></table>`
    :'<p class="warn">尚未建立观察窗口</p>';
  const a=v.authority;
  $('authority').innerHTML=`<p>当前关闭持权人：<strong>${a.actor??'incident_commander（未交接，任值班指挥）'}</strong>，角色 <span class="mono">${a.role}</span>，交接窗口 <span class="mono">v${a.handover_version}</span></p>`;
}
function renderSignoffs(v){
  const ce=v.current_effective_signoff;
  $('effective').innerHTML=ce
    ? `<p class="ok">✔ 当前有效签认 #${ce.id}：${ce.submitted_by}(${ce.submitted_role})，观察v${ce.observation_version} / 交接v${ce.handover_version}，依据风向 ${ce.basis_wind_dir}，确认人 ${ce.confirmed_by||'-'}</p>`
    : '<p class="bad">✘ 当前没有有效签认（未提交、待确认、已失效或已被拒绝）</p>';
  const rows=[...v.signoffs].reverse().map(s=>`<tr>
      <td>#${s.id}</td><td>${badge(s.status)}</td>
      <td>${s.submitted_by}<br><span class="small">${s.submitted_role}</span></td>
      <td class="mono">obs v${s.observation_version}<br>hand v${s.handover_version}</td>
      <td class="mono">${s.basis_wind_dir}</td>
      <td>${s.confirmed_by||'-'}</td>
      <td class="${s.failure_reason?'bad':''}">${s.failure_reason?('⛔ '+s.failure_reason):''}${s.invalidated_by_kind?'<br><span class="small">触发：'+s.invalidated_by_kind+'</span>':''}</td>
    </tr>`).join('');
  $('signoffs').innerHTML=`<table><tr><th>ID</th><th>状态</th><th>提交人</th><th>所凭窗口版本</th><th>依据风向</th><th>确认人</th><th>失败/失效原因</th></tr>${rows}</table>`;
}
function renderAudit(events,ok){
  $('chainState').innerHTML=ok?'<span class="ok">审计链哈希校验通过 ✓</span>':'<span class="bad">审计链校验失败 ✗</span>';
  const rows=events.map(e=>{
    const d=typeof e.detail==='string'?JSON.parse(e.detail):e.detail;
    const extra=d.reason?`<br><span class="bad small">${d.reason}</span>`:''
      +(d.invalidated_signoff_ids&&d.invalidated_signoff_ids.length?`<br><span class="small">失效签认: ${d.invalidated_signoff_ids.join(',')}</span>`:'')
      +(d.from_actor?`<br><span class="small">交接 ${d.from_actor}(${d.from_role}) → ${d.to_actor}(${d.to_role})</span>`:'')
      +(d.wind_dir?`<br><span class="small">风向: ${d.wind_dir} @ v${d.version??d.observation_version}</span>`:'')
      +(d.signoff_id?`<br><span class="small">签认 #${d.signoff_id}</span>`:'');
    return `<tr><td>${e.id}</td><td class="mono">${e.created_at.replace('T',' ').replace('+00:00','Z')}</td>
      <td class="mono">${e.action}</td><td>${e.actor}</td><td class="hash mono" title="${e.entry_hash}">${e.entry_hash.slice(0,18)}…${extra}</td></tr>`;
  }).join('');
  $('audit').innerHTML=`<table><tr><th>#</th><th>UTC时间</th><th>动作</th><th>操作人</th><th>哈希/详情</th></tr>${rows}</table>`;
}
async function loadAll(){
  const id=$('iid').value;
  try{
    const v=await api('GET',`/api/items/${id}/signoffs`);
    renderObs(v);renderSignoffs(v);
    const aud=await api('GET',`/api/audit?item_id=${id}`).catch(()=>({events:[]}));
    renderAudit(aud.events||[],v.audit_chain_ok);
  }catch(e){/* toast already shown */}
}
loadAll();
</script>
</body>
</html>
